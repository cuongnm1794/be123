<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Nam Cao Nguyên</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>Nam Cao Nguyên</h1>
      <p class="muted">Chỉ đọc trang LMS + click qua server — không UI/script trên trang</p>
    </header>

    <p id="site-warning" class="warning hidden"></p>

    <div class="actions">
      <button type="button" id="btn-lookup" class="primary">Tra index</button>
      <button type="button" id="btn-push-result" class="primary">Gửi kết → BE</button>
      <button type="button" id="btn-server-one" class="primary">Click đúng + Tiếp</button>
      <button type="button" id="btn-server-loop" class="primary accent">Auto server</button>
      <button type="button" id="btn-practice-x3" class="primary practice-x3">Auto server (3 lần)</button>
      <span id="practice-x3-status" class="status small"></span>
    </div>

    <hr class="section-divider" />

    <div class="actions">
      <button type="button" id="btn-sim-quiz-auto" class="primary accent sim-quiz">Auto mô phỏng quiz</button>
    </div>

    <label class="checkbox auto-lookup-row">
      <input type="checkbox" id="chk-auto-lookup" checked />
      Tự tra index mỗi giây (chỉ đọc trang + BE)
    </label>

    <p id="status" class="status" aria-live="polite"></p>

    <div class="actions secondary-actions">
      <button type="button" id="btn-html">Xuất page source (HTML)</button>
      <button type="button" id="btn-scripts">Xuất danh sách script</button>
      <button type="button" id="btn-both">Xuất cả hai</button>
    </div>

    <footer>
      <a href="#" id="open-options">Cài đặt</a>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
