services:
  postgres:
    image: postgres:16-alpine
    container_name: ncn-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: quiznamcaonguyen
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./be-namcaonguyen/sql/init.sql:/docker-entrypoint-initdb.d/01-quiz-init.sql:ro
      - ./accounts_db/docker-init-accounts-db.sh:/docker-entrypoint-initdb.d/02-accounts-db.sh:ro

volumes:
  postgres_data:
